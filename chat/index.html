<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Pandora · Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f7;color:#1e1e1e;font:16px/1.5 Inter,system-ui,-apple-system,sans-serif}main{max-width:850px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:24px;margin:0}header p{color:#626262;margin:2px 0 0;font-size:14px}button{font:inherit;cursor:pointer;border:1px solid #ddd;background:white;border-radius:999px;padding:10px 18px}button:disabled{opacity:.5;cursor:wait}nav{display:flex;gap:8px}#messages{flex:1;padding:24px 0;min-height:250px}.message{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:16px 20px;margin:12px 0;max-width:90%}.user{background:#1e1e1e;color:white;margin-left:auto}.label{display:block;font-size:12px;opacity:.65;margin-bottom:6px}.empty{color:#626262;padding:12vh 0;text-align:center}form#compose{position:sticky;bottom:0;background:#f7f7f7;padding:12px 0;display:flex;gap:10px;align-items:end}textarea{resize:vertical;width:100%;min-height:70px;max-height:220px;border:1px solid #ddd;border-radius:14px;padding:14px;font:inherit}#send{background:#111;color:white;border-color:#111}#status{min-height:24px;color:#626262;font-size:14px}button:focus-visible,textarea:focus-visible{outline:2px solid #111;outline-offset:3px}@media(max-width:550px){main{padding:16px}header{align-items:start}nav{gap:5px}nav button{font-size:13px;padding:8px 10px}.message{max-width:96%}}
</style></head><body><main><header><div><h1>Pandora</h1><p>A little space to think out loud.</p></div><nav><button id="clear">New chat</button><form method="post" action="/chat/logout"><button>Lock</button></form></nav></header><section id="messages" aria-live="polite" aria-label="Conversation"><p class="empty">The box is open. What’s on your mind?</p></section><div id="status" role="status"></div><form id="compose"><textarea id="input" aria-label="Message" placeholder="Ask something…" maxlength="24000" required></textarea><button id="send">Send</button></form><small id="model" style="color:#626262"></small><small style="color:#626262">Responses can be mistaken. Chats are kept only in this tab.</small></main>
<script>
const area=document.querySelector('#messages'),input=document.querySelector('#input'),status=document.querySelector('#status'),send=document.querySelector('#send'),clear=document.querySelector('#clear');let history=[];
function message(role,text){area.querySelector('.empty')?.remove();let box=document.createElement('div');box.className='message '+role;let label=document.createElement('span');label.className='label';label.textContent=role==='user'?'You':'Pandora';box.append(label,document.createTextNode(text));area.append(box);box.scrollIntoView({behavior:'smooth',block:'end'});}
clear.onclick=()=>{history=[];area.replaceChildren();status.textContent='New chat started.';input.focus()};
document.querySelector('#compose').onsubmit=async e=>{e.preventDefault();let text=input.value.trim();if(!text)return;message('user',text);input.value='';send.disabled=clear.disabled=true;status.textContent='Thinking…';const pending=[...history,{role:'user',content:text}];try{const r=await fetch('/chat/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:pending})});if(r.status===401){location.href='/chat/';return}const data=await r.json();if(!r.ok)throw Error(data.error||'Please try again shortly.');message('assistant',data.reply);document.querySelector('#model').textContent=typeof data.model==='string'?'Model: '+data.model:'';history=[...pending.slice(-data.kept_messages),{role:'assistant',content:data.reply}].slice(-30);status.textContent=(data.history_trimmed||data.kept_messages>=30)?'Some older messages were left out to make room for this reply.':'';}catch(error){status.textContent=error.message;input.value=text;}finally{send.disabled=clear.disabled=false;input.focus()}};
input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!send.disabled){e.preventDefault();document.querySelector('#compose').requestSubmit()}};
</script></body></html>
