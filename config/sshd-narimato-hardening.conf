# Key-only SSH on both Narimato hosts (owner decision 2026-10-30).
# Installed as /etc/ssh/sshd_config.d/10-narimato-hardening.conf. sshd_config includes the
# drop-in directory first and the first value read wins, so these beat the distribution defaults.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
MaxAuthTries 3
LoginGraceTime 30
