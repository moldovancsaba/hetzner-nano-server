services:
  ollama:
    image: ollama/ollama@sha256:dea72d1e22270fe095b68fdf756d2b489d615643c5a2eaebbc5f569181e322d8
    container_name: narimato-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "8"
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_KEEP_ALIVE: "30m"
      # Do not remove or raise the next two. They cap the prompt cache (128 MiB) and the context
      # checkpoints (2) so repeated 8K requests fit inside mem_limit. With the default 8 GiB cache,
      # repeated requests were OOM-killed under this cap even though a single long request succeeded
      # (docs/OPERATIONS.md, "Context and cache limits").
      LLAMA_ARG_CACHE_RAM: "128"
      LLAMA_ARG_CTX_CHECKPOINTS: "2"
    mem_limit: 2800m
    cpus: 2
    volumes:
      - ollama:/root/.ollama
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  ollama:
