<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Paperclip</title>
<style>
:root{--bg:#f7f7f7;--surface:#fff;--text:#1e1e1e;--muted:#626262;--line:#e5e5e5;--accent:#111;--alert:#9b1c1c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px}
h1{margin:0 0 6px;font-size:1.5rem}
p{margin:0 0 20px;color:var(--muted);line-height:1.5}
label{display:block;margin:0 0 6px;font-size:.875rem;font-weight:600}
input{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;color:var(--text);background:#fff}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{width:100%;min-height:44px;margin-top:14px;border:1px solid var(--accent);border-radius:999px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.note{margin:14px 0 0;color:var(--alert);font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>Paperclip</h1>
<p>Enter your Pandora secret to open Paperclip.</p>
<form method="post" action="/_access/login">
<label for="secret">Secret</label>
<input id="secret" name="secret" type="password" autocomplete="current-password" required autofocus>
<button type="submit">Open</button>

</form>
</main>
</body>
</html>
